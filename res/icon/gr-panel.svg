<?xml version="1.0" encoding="UTF-8"?>
<!--
  Знак панели «Зелёный Ритм».

  ПОЧЕМУ ТАК. Кнопка стоит первой в ряду и рисуется в 24 точки — на этом
  размере выживает только крупная форма и один-два хода линии. Отсюда плашка
  вместо контура и пульс вместо буквы: имя читается прямо, «ритм» — линией,
  «зелёный» — цветом, тем же #3fb950, что и акцент темы (modern.css).

  Соседние иконки набора цветные и подробные, поэтому плоский знак среди них
  заметен сам по себе — а заметность и была задачей: наши функции полгода
  лежали в подменю второго уровня, и их не находили.

  Без служебных данных редактора: файл правится руками, и мусор Inkscape в нём
  только мешает читать.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="gr-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ac95c"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="40" height="40" rx="11" fill="url(#gr-green)"/>

  <!--
    Пульс. Спокойная линия, один всплеск, снова спокойная: так силуэт остаётся
    узнаваемым и когда иконка ужата до 16 точек в системном лотке.
    Скруглённые концы — чтобы на малом размере линия не выглядела обрубленной.
  -->
  <path d="M11 24 h6 l3.2 -8.4 l5.2 16.8 l3.2 -8.4 h8.4"
        fill="none" stroke="#ffffff" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>

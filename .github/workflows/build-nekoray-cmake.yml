name: GreenRhythm Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag"
        required: true
      publish:
        description: "Publish release (yes/no)"
        required: false
        default: "yes"
  # СОБИРАЕМ И РАБОЧИЕ ВЕТКИ, а не только main.
  #
  # Раньше здесь стоял один main, и это давало ровно ту картину, из-за которой
  # и завели эту правку: ветку отправили, в Actions пусто, и выглядит это как
  # поломка, хотя ничего не сломано — просто запускать было нечем.
  #
  # Шаблоны feat/** и fix/** покрывают весь принятый здесь именной обиход и не
  # трогают чужие ветки. Publish при этом НЕ выполняется: он закрыт условием
  # github.event_name == 'workflow_dispatch', то есть пуш даёт сборку и
  # артефакты, но никогда — публичный выпуск.
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-go:
    strategy:
      matrix:
        include:
          - cross_os: windows
            cross_arch: amd64
          - cross_os: public_res
            cross_arch: public_res
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        if: matrix.cross_os != 'public_res'
        uses: actions/setup-go@v4
        with:
          go-version: "^1.24"

      - name: Clone libneko dependency
        if: matrix.cross_os != 'public_res'
        run: |
          git clone --depth 1 https://github.com/MatsuriDayo/libneko.git ../libneko

      - name: Build Go
        if: matrix.cross_os != 'public_res'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          GOOS=${{ matrix.cross_os }} GOARCH=${{ matrix.cross_arch }} ./libs/build_go.sh

      - name: Test Go (native)
        if: matrix.cross_os == 'windows'
        shell: bash
        run: |
          (cd go/grpc_server && go test ./...)
          (cd go/cmd/nekobox_core && go test -tags "with_clash_api,with_gvisor,with_quic,with_wireguard,with_utls,with_v2ray_api" ./...)

      - name: Build public resources
        if: matrix.cross_os == 'public_res'
        run: ./libs/build_public_res.sh

      - name: Download rule-set files
        if: matrix.cross_os == 'public_res'
        run: |
          mkdir -p deployment/public_res
          curl -sL -o deployment/public_res/geosite-category-ads-all.srs \
            "https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-category-ads-all.srs"
          curl -sL -o deployment/public_res/geoip-ru.srs \
            "https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-ru.srs"

      # ОТДЕЛЬНЫМ ШАГОМ И ИЗ КОРНЯ — так же, как на macOS, где он проходит.
      #
      # Внутри общего шага он звался из build/testrun и дважды подряд ронял
      # работу, а по имени шага «Run test suites» причина не отличалась от любой
      # другой. Набор читает файлы дерева; запускать его оттуда, где лежат
      # остальные, значит держать лишнюю переменную ради ничего.
      - name: Test the tunnel exclusions against our own ranges
        shell: bash
        env:
          DL_QT_VER: "6.7"
        run: |
          source libs/env_qtsdk.sh $PWD/qtsdk/Qt
          ./build/tun_exclude_test.exe

      - name: Tar artifacts
        run: tar czvf artifacts.tgz ./deployment

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreenRhythm-${{ github.sha }}-${{ matrix.cross_os }}-${{ matrix.cross_arch }}
          path: artifacts.tgz

  # КРОСС-СБОРКА GO ПОД DARWIN — ОТДЕЛЬНЫМ JOB'ОМ, И ЭТО НЕ КОСМЕТИКА.
  #
  # Сначала эти две строки стояли в матрице build-go, а build-go есть в needs у
  # publish. Матрица с fail-fast: false не спасает: она лишь не отменяет соседние
  # леги, но сам job всё равно считается провалившимся, и всё зависимое
  # пропускается. То есть любая будущая поломка под darwin — не собравшийся
  # sing-box, недоступный libneko, смена образа — тихо заблокировала бы ВЫПУСК
  # ПОД WINDOWS. Ровно то, чего мы обещали не допустить.
  #
  # Кросс-сборка идёт с ubuntu-раннера: CGO_ENABLED=0, Xcode не нужен. Проверено
  # сборкой обеих архитектур на посторонней машине.
  build-go-macos:
    strategy:
      matrix:
        cross_arch: [arm64, amd64]
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: "^1.24"

      - name: Clone libneko dependency
        run: git clone --depth 1 https://github.com/MatsuriDayo/libneko.git ../libneko

      - name: Build Go
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          GOOS=darwin GOARCH=${{ matrix.cross_arch }} ./libs/build_go.sh

      - name: Tar artifacts
        run: tar czvf artifacts.tgz ./deployment

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreenRhythm-${{ github.sha }}-darwin-${{ matrix.cross_arch }}
          path: artifacts.tgz

  build-windows:
    runs-on: windows-2022
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Install MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.2
          arch: x64

      - name: Download Qt SDK
        shell: bash
        env:
          DL_QT_VER: "6.7"
        run: bash ./libs/download_qtsdk_win.sh

      - name: Install ninja
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: libs/deps
          key: WinDeps-x64-${{ hashFiles('libs/build_deps_*.sh') }}-Qt6.7

      - name: Build Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: bash
        run: ./libs/build_deps_all.sh

      - name: Set version from tag
        if: github.event.inputs.tag != ''
        shell: bash
        run: echo -n "${{ github.event.inputs.tag }}" > nekoray_version.txt

      - name: Build Qt GUI
        shell: bash
        env:
          DL_QT_VER: "6.7"
          RELEASE_TAG: ${{ github.event.inputs.tag || '' }}
          CC: cl.exe
          CXX: cl.exe
        run: |
          source libs/env_qtsdk.sh $PWD/qtsdk/Qt
          mkdir build
          cd build
          cmake -GNinja -DQT_VERSION_MAJOR=6 -DCMAKE_BUILD_TYPE=Release ..
          ninja -j2
          cd ..
          ./libs/deploy_windows64.sh

      - name: Run test suites
        shell: bash
        env:
          DL_QT_VER: "6.7"
        run: |
          # Наборы собираются и гоняются здесь, а не «когда-нибудь руками».
          # Каждый из них закрывает место, где ошибка не отказывает, а молчит:
          # разбор вывода резервного канала (утечка в журнал), хранилище
          # реквизитов (потеря идентификатора устройства) и сборка файла
          # автонастройки для macOS (трафик уходит не туда).
          source libs/env_qtsdk.sh $PWD/qtsdk/Qt
          cd build
          ninja relaytrace_test credentials_test pac_test relay_component_test tun_exclude_test
          cd ..
          # Запуск из временного каталога: credentials_test пишет device.dat
          # рядом с собой, и делать это в дереве сборки незачем.
          mkdir -p build/testrun
          cp build/relaytrace_test.exe build/credentials_test.exe build/pac_test.exe build/relay_component_test.exe build/testrun/
          cp build/tun_exclude_test.exe build/
          cd build/testrun
          ./relaytrace_test.exe
          ./credentials_test.exe
          ./pac_test.exe
          ./relay_component_test.exe
          # Файл автонастройки исполняется настоящим движком: разбор текста не
          # отвечает на вопрос, разбирается ли он вообще и что возвращает.
          node ../../support/Test-Pac.js pac-sample.pac

      - name: Tar artifacts
        shell: bash
        run: tar czvf artifacts.tgz ./deployment

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreenRhythm-${{ github.sha }}-windows-x64-Qt6.7
          path: artifacts.tgz

  # СБОРКА ПОД MACOS. Отдельным job'ом и НЕ В needs у publish — см. комментарий
  # там же. Пока она в бете, её поломка не имеет права задержать выпуск под
  # Windows, которым пользуются сегодня.
  build-macos:
    strategy:
      matrix:
        include:
          # ОБРАЗ ЗАКРЕПЛЁН, А НЕ «latest», и это не перестраховка.
          #
          # На macos-latest приехал Xcode 26, а в его SDK больше нет фреймворка
          # AGL. Qt 6.7 при этом в своём же FindWrapOpenGL.cmake ищет AGL и, НЕ
          # НАЙДЯ, всё равно подставляет «-framework AGL» — линковка падает
          # целиком. Это баг Qt, который в наших исходниках не исправить.
          #
          # macos-15 несёт тот же Xcode 16.4, на котором ветка Intel собирается
          # без единой ошибки. Обновлять образ — отдельное решение, вместе с
          # версией Qt, а не молча в тот день, когда GitHub переставит «latest».
          - arch: arm64
            runner: macos-15
          # macos-13 GitHub отключил 4 декабря 2025 — job на нём не получал бы
          # раннера вовсе и падал бы, не выполнив ни шага.
          - arch: amd64
            runner: macos-15-intel
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    # Ждёт СВОЮ Go-сборку, а не общий build-go: тот в needs у publish, и связывать
    # с ним мак значило бы вернуть ту самую блокировку выпуска под Windows.
    needs: build-go-macos
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # МОДУЛИ НЕ ПЕРЕЧИСЛЯЮТСЯ, и это не упрощение. Здесь стояло
      # modules: "qtsvg", и установка падала: в Qt 6 qtsvg НЕ является
      # устанавливаемым модулем — он входит в базовый набор. Установщик на
      # несуществующее имя отвечает отказом, и шаг валился целиком.
      #
      # Проверено самим aqtinstall, а не догадкой:
      #   aqt list-qt mac desktop --modules 6.7.3 clang_64   → qtsvg в списке НЕТ
      #   aqt list-qt mac desktop --archives 6.7.3 clang_64  → qtsvg, qtbase,
      #     qttools, qttranslations, qtdeclarative — ЕСТЬ
      # То есть всё, что требует CMakeLists (Widgets, Network, Svg,
      # LinguistTools), приезжает и без единого модуля.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          cache: true

      - name: Install ninja
        run: brew install ninja

      # ЗАВИСИМОСТИ СОБИРАЮТСЯ И ЗДЕСЬ. Без этого шага конфигурация умирает на
      # самой первой команде cmake: cmake/myproto.cmake требует Protobuf, а
      # дальше идут yaml-cpp и ZXing — все три ищутся в libs/deps/built, который
      # в репозиторий не закоммичен (libs/.gitignore). У Windows такой шаг есть,
      # у мака его не было вовсе, то есть .dmg не появился бы ни разу.
      #
      # Отключить их нельзя: NKR_NO_EXTERNAL заодно выключает gRPC, а на нём
      # держится связь с ядром.
      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: libs/deps
          key: MacDeps-${{ matrix.arch }}-${{ hashFiles('libs/build_deps_*.sh') }}-Qt6.7

      - name: Build Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: bash
        run: ./libs/build_deps_all.sh

      - name: Set version from tag
        if: github.event.inputs.tag != ''
        shell: bash
        run: echo -n "${{ github.event.inputs.tag }}" > nekoray_version.txt

      - name: Build Qt GUI
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          set -o pipefail
          mkdir build
          cd build
          cmake -GNinja -DQT_VERSION_MAJOR=6 -DCMAKE_BUILD_TYPE=Release .. 2>&1 | tee ../macos-cmake.log
          ninja -j3 2>&1 | tee ../macos-build.log

      # ШАГИ РАЗВЕДЕНЫ ПОИМЁННО. Один общий шаг сообщал только «Run test suites
      # -> failure», и по этому нельзя понять, что именно случилось: не собрался
      # набор, упала проверка или не нашёлся node. Имя шага видно в API прогона,
      # а вот журнал — нет: он требует прав на репозиторий.
      - name: Build test suites
        shell: bash
        run: |
          set -o pipefail
          cd build
          ninja relaytrace_test credentials_test pac_test relay_component_test tun_exclude_test 2>&1 | tee ../macos-tests-build.log
          mkdir -p testrun
          cp relaytrace_test credentials_test pac_test relay_component_test testrun/

      - name: Test — разбор вывода резерва
        shell: bash
        run: cd build/testrun && ./relaytrace_test 2>&1 | tee ../../macos-test-relaytrace.log

      # На маке запечатка своя (от идентификатора машины), и набор проверяет
      # именно её: «на диске нет читаемых ключей» на разных платформах держится
      # на разном коде.
      - name: Test — хранилище реквизитов
        shell: bash
        run: cd build/testrun && ./credentials_test 2>&1 | tee ../../macos-test-credentials.log

      - name: Test — сборка файла автонастройки
        shell: bash
        run: cd build/testrun && ./pac_test 2>&1 | tee ../../macos-test-pac.log

      - name: Test the relay component contract
        run: cd build/testrun && ./relay_component_test 2>&1 | tee ../../macos-test-component.log

      - name: Test the tunnel exclusions against our own ranges
        run: ./build/tun_exclude_test 2>&1 | tee macos-test-tunexclude.log

      - name: Test — исполнение файла автонастройки
        shell: bash
        run: cd build/testrun && node ../../support/Test-Pac.js pac-sample.pac

      - name: Download Go artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: GreenRhythm-${{ github.sha }}-darwin-${{ matrix.arch }}
          path: download-artifact

      # ВНЕШНЕЕ ЯДРО XRAY — В БАНДЛ. Без него на маке не подключатся профили,
      # которые sing-box не разбирает и которые этот форк намеренно уводит на
      # внешнее ядро: xhttp и Reality с постквантовым обменом. Человек увидел бы
      # не «не поддерживается», а молчаливый отказ подключения.
      #
      # Версия и суммы закреплены так же, как для Windows, и суммы не переписаны
      # из чужого файла: обе скачаны и посчитаны, а затем сверены с
      # опубликованными .dgst — совпали. Обновлять пару «версия + сумма» только
      # вместе и только после проверки.
      - name: Fetch pinned xray
        shell: bash
        env:
          XRAY_VERSION: "v26.3.27"
        run: |
          set -e
          case "${{ matrix.arch }}" in
            arm64) ASSET="Xray-macos-arm64-v8a.zip"; SHA="2e93a67e8aa1936ecefb307e120830fcbd4c643ab9b1c46a2d0838d5f8409eaf" ;;
            amd64) ASSET="Xray-macos-64.zip";        SHA="f5b0471d3459eff1b82e48af0aeac186abcc3298210070afbbbd8437a4e8b203" ;;
            *) echo "неизвестная архитектура"; exit 1 ;;
          esac
          mkdir -p deployment
          curl -fsSL -o /tmp/xray.zip             "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${ASSET}"
          echo "${SHA}  /tmp/xray.zip" | shasum -a 256 -c -
          unzip -o -j /tmp/xray.zip xray -d /tmp/xrayout
          mv /tmp/xrayout/xray "deployment/xray-macos-${{ matrix.arch }}"
          chmod +x "deployment/xray-macos-${{ matrix.arch }}"

      # ГЕОБАЗЫ И НАБОРЫ ПРАВИЛ. Без geoip.db и geosite.db приложение НЕ
      # СОБИРАЕТ КОНФИГУРАЦИЮ ВООБЩЕ: db/ConfigBuilder.cpp проверяет их наличие
      # до всего остального, и человек на любой профиль получает окно с отказом
      # вместо подключения. То есть без этого шага macOS-сборка бесполезна
      # целиком, а выглядит рабочей.
      #
      # Качаются здесь напрямую, а не берутся из артефакта public_res: тот
      # собирается в build-go, а связывать мак с build-go нельзя — он в needs у
      # publish, и поломка мака вернулась бы блокировкой выпуска под Windows.
      - name: Fetch geo data
        shell: bash
        run: |
          set -e
          mkdir -p deployment/public_res
          curl -fLso deployment/public_res/geoip.db             "https://github.com/SagerNet/sing-geoip/releases/latest/download/geoip.db"
          curl -fLso deployment/public_res/geosite.db             "https://github.com/SagerNet/sing-geosite/releases/latest/download/geosite.db"
          curl -fLso deployment/public_res/geosite-category-ads-all.srs             "https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-category-ads-all.srs"
          curl -fLso deployment/public_res/geoip-ru.srs             "https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-ru.srs"
          # Пустой файл curl создаёт и при отказе, поэтому проверяем размер: без
          # этого сборка вышла бы с нулевыми базами и вела бы себя как без них.
          for f in geoip.db geosite.db geosite-category-ads-all.srs geoip-ru.srs; do
            test -s "deployment/public_res/$f" || { echo "пустой или отсутствует: $f"; exit 1; }
          done

      - name: Deploy bundle
        shell: bash
        env:
          NKR_MACOS_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          set -o pipefail
          find download-artifact -name artifacts.tgz | xargs -n1 tar xvzf
          # Вывод сохраняется: без журнала отказ выкладки виден только как имя
          # шага, а причина не доезжает никуда — первый прогон это и показал.
          ./libs/deploy_macos.sh 2>&1 | tee macos-deploy.log

      # Образ обязан существовать. continue-on-error защищает выпуск под
      # Windows и не должен заодно прятать факт, что мака в релизе нет: без
      # этой проверки шаг выкладки просто ничего не найдёт и промолчит.
      - name: Check the image exists
        shell: bash
        run: |
          ls -la deployment/macos-${{ matrix.arch }}/
          test -n "$(ls deployment/macos-${{ matrix.arch }}/*.dmg 2>/dev/null)"

      # ПРИЛОЖЕНИЕ ЗАПУСКАЕТСЯ ЗДЕСЬ, А НЕ У ЧЕЛОВЕКА.
      #
      # До 2026-08-25 оно не запускалось НИГДЕ: CI гонял только консольные наборы,
      # а про macOS проверял ровно то, что файл образа существует. Первым живым
      # запуском за всю историю проекта стал запуск у тестера, и он ответил
      # «не запускается» — без текста ошибки, то есть без причины.
      #
      # Шаг ловит ровно тот отказ, который CI поймать в состоянии: приложение не
      # собралось в рабочее целое — не нашлась библиотека Qt, не переписаны пути,
      # нет оконного слоя. Такое умирает до первого окна, и снаружи выглядит
      # неотличимо от всего остального.
      #
      # ЧЕГО ШАГ НЕ ЛОВИТ, и это надо знать: он не заменяет живого мака. Окно
      # Gatekeeper решается политикой системы (следующий шаг), а как приложение
      # ВЫГЛЯДИТ, offscreen не покажет.
      #
      # ТАЙМАУТ — ЭТО УСПЕХ. Приложение обязано жить, а не завершиться: живое
      # значит дошло до цикла событий. Отказом считается ранний выход.
      - name: Smoke-launch the bundle
        shell: bash
        run: |
          set -o pipefail
          DMG=$(ls deployment/macos-${{ matrix.arch }}/*.dmg | head -1)
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT" >/dev/null

          # В /Applications, а не из образа: запуск из образа наше же приложение
          # отвергает намеренно (main.cpp, ветка AppTranslocation), и проверка
          # мерила бы эту ветку вместо готовности пакета.
          sudo cp -R "$MNT/GreenRhythm.app" /Applications/
          hdiutil detach "$MNT" >/dev/null

          echo "--- чем слинковано ---"
          otool -L /Applications/GreenRhythm.app/Contents/MacOS/greenrhythm | head -20

          export QT_QPA_PLATFORM=offscreen
          /Applications/GreenRhythm.app/Contents/MacOS/greenrhythm > launch.log 2>&1 &
          PID=$!
          sleep 12

          if kill -0 "$PID" 2>/dev/null; then
              echo "приложение поднялось и живёт — цикл событий достигнут"
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
              echo "--- что оно успело напечатать ---"
              cat launch.log || true
          else
              wait "$PID" 2>/dev/null
              CODE=$?
              echo "::error::приложение завершилось само, код $CODE — пакет не собрался в рабочее целое"
              echo "--- вывод приложения ---"
              cat launch.log || true
              echo "--- отчёты о падении ---"
              ls -lt ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5 || true
              for r in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1); do
                  echo "--- $r ---"; head -60 "$r"
              done
              exit 1
          fi

      # ЧТО УВИДИТ ЧЕЛОВЕК, СКАЧАВШИЙ ЭТОТ ОБРАЗ.
      #
      # Шаг воспроизводит положение тестера буквально: помечает приложение
      # карантином — тем самым, который система вешает на всё скачанное из
      # интернета, — и спрашивает у самой системы, пустит ли она его.
      #
      # ЭТО НЕ ОТКАЗ СБОРКИ. Подписи разработчика у нас нет, и «rejected» здесь
      # ожидаем; ставить сборку в зависимость от него значило бы никогда не
      # выпустить мак. Ценность в другом: точная формулировка отказа попадает в
      # журнал КАЖДОГО выпуска. Тогда на вопрос «что человек увидит» отвечает
      # запись, а не память тестера, — а разные отказы лечатся по-разному:
      # «повреждено» и «разработчик не проверен» это две разные дороги.
      - name: What a downloader will face
        shell: bash
        continue-on-error: true
        run: |
          APP=/Applications/GreenRhythm.app
          sudo xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" "$APP" || true

          echo "--- метки на приложении ---"
          xattr -l "$APP" || true

          echo "--- целостность подписи ---"
          codesign --verify --deep --strict -vvv "$APP" 2>&1 || true

          echo "--- вердикт системной политики ---"
          spctl -a -t exec -vvv "$APP" 2>&1 || true

          echo ""
          echo "Напоминание: без сертификата Developer ID отказ здесь ожидаем."
          echo "Человеку помогает: xattr -dr com.apple.quarantine /Applications/GreenRhythm.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreenRhythm-${{ github.sha }}-macos-${{ matrix.arch }}
          path: deployment/macos-${{ matrix.arch }}/*.dmg

      # ПОЧЕМУ ОТЧЁТ ОБ ОШИБКЕ ВЫВОДИТСЯ ОТДЕЛЬНЫМ ШАГОМ.
      #
      # Журнал прогона по API отдаётся только тем, у кого есть права на
      # репозиторий, а разбирать поломку часто приходится тому, у кого их нет.
      # Строки с ::error:: попадают в аннотации проверки, а те читаются
      # открыто — то есть причина становится видна, не открывая Actions.
      - name: Report failure details
        if: failure()
        shell: bash
        run: |
          # СНАЧАЛА СТРОКИ ОШИБОК, ПОТОМ ХВОСТ. Аннотаций на шаг отдаётся
          # ограниченное число, и первый же прогон это показал: весь запас
          # съел хвост успешного журнала конфигурации, а настоящая причина —
          # падение набора проверок — не поместилась вовсе.
          for f in macos-cmake.log macos-build.log macos-tests-build.log                    macos-test-relaytrace.log macos-test-credentials.log macos-test-pac.log                    macos-deploy.log; do
            [ -f "$f" ] || continue
            hits=$(grep -nE "error:|Error|FAILED|fatal|ПЛОХО|undefined|No such file" "$f" | head -8 || true)
            if [ -n "$hits" ]; then
              echo "::error::===== $f ====="
              echo "$hits" | while IFS= read -r line; do
                echo "::error::$line"
              done
            fi
          done
          # Хвост — у последнего ПО ПОРЯДКУ ШАГОВ журнала, который существует.
          # Раньше брался самый свежий по времени, и это давало не тот файл:
          # успешный набор проверок пишется позже, чем падает сборка.
          last=""
          for f in macos-cmake.log macos-build.log macos-tests-build.log                    macos-test-relaytrace.log macos-test-credentials.log                    macos-test-pac.log macos-deploy.log; do
            [ -f "$f" ] && last="$f"
          done
          if [ -n "$last" ]; then
            echo "::error::===== хвост $last ====="
            tail -8 "$last" | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          echo "::error::===== окружение ====="
          echo "::error::system: $(sw_vers -productVersion 2>/dev/null) arch: $(uname -m)"
          echo "::error::cmake: $(cmake --version 2>/dev/null | head -1)"
          echo "::error::qt: ${QT_ROOT_DIR:-не задан}"


  publish:
    name: Pack & Publish
    # always() обязателен: без него job пропускается, как только ЛЮБОЙ из needs
    # не удался, — то есть падение мака унесло бы с собой выпуск под Windows,
    # ровно то, чего мы не допускаем. Условия ниже перечисляют, что ДЕЙСТВИТЕЛЬНО
    # обязано было получиться.
    if: >-
      always() && github.event_name == 'workflow_dispatch'
      && needs.build-windows.result == 'success'
      && needs.build-go.result == 'success'
    runs-on: ubuntu-latest
    # build-macos ЗДЕСЬ НАМЕРЕННО НЕТ.
    #
    # Это главная ловушка всей затеи с маком, и попасть в неё легко: кажется
    # естественным перечислить в needs всё, что собирается. Но тогда любая
    # поломка на маке — сменившаяся метка Intel-раннера, отвалившийся Qt-экшен,
    # недоступный релиз xray — блокирует ВЫПУСК ПОД WINDOWS, которым пользуются
    # сегодня и который выпускается отсюда.
    #
    # Артефакты мака подтягиваются ниже отдельным шагом, и его отсутствие не
    # мешает выпуску: пока macOS в бете, нет dmg — не повод не отдать людям
    # Windows.
    #
    # ДОПОЛНЕНО ПОСЛЕ РАЗБОРА ГОТОВНОСТИ К ВЫПУСКУ. Обещание «мак не блокирует
    # Windows» осталось в силе, но выяснилось второе: publish НЕ ЖДАЛ мак вовсе
    # и забирал те артефакты, что успели загрузиться. Маковые job'ы длиннее
    # (свои зависимости, Qt, macdeployqt, hdiutil), поэтому выпуск, заявленный
    # как «поддержка macOS», уходил бы БЕЗ единого .dmg — при зелёном прогоне и
    # без единого слова.
    #
    # Теперь мак в needs, но с if ниже: он ждёт его ЗАВЕРШЕНИЯ, а не успеха.
    # Поломка мака по-прежнему не мешает выпуску под Windows — просто выпуск
    # выйдет без образов, и шаг сбора об этом предупредит.
    needs:
      - build-windows
      - build-go
      - build-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: download-artifact

      - name: Pack Windows Release
        run: |
          source libs/env_deploy.sh
          find . -name artifacts.tgz | xargs -n1 tar xvzf
          cd deployment
          # Copy geodata to root
          cp -r public_res/*.dat windows64/ 2>/dev/null || true
          cp -r public_res/*.db windows64/ 2>/dev/null || true
          # Copy .srs rule-sets to config/ (sing-box CWD)
          mkdir -p windows64/config
          cp public_res/*.srs windows64/config/ 2>/dev/null || true
          # Bundle a PINNED xray core so xhttp / post-quantum Reality servers (which
          # sing-box cannot parse) work out of the box — ExtraCore::Get auto-detects
          # ./xray.exe. Pin the version and verify the checksum so every build of a tag is
          # reproducible and a new upstream xray can't silently ride into a release; bump
          # XRAY_VERSION/XRAY_SHA256 deliberately after testing.
          XRAY_VERSION="v26.3.27"
          XRAY_SHA256="d004c39288ce9ada487c6f398c7c545f7d749e44bdfdd59dbc9f865afba4e1ad"
          curl -fsSL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-windows-64.zip"
          echo "${XRAY_SHA256}  /tmp/xray.zip" | sha256sum -c -
          unzip -o -j /tmp/xray.zip xray.exe -d windows64/
          test -f windows64/xray.exe
          rm -rf public_res *.pdb
          mv windows64 GreenRhythm
          zip -r GreenRhythm-${{ github.event.inputs.tag }}-windows-x64.zip GreenRhythm
          rm -rf GreenRhythm
          sha256sum GreenRhythm-${{ github.event.inputs.tag }}-windows-x64.zip > GreenRhythm-${{ github.event.inputs.tag }}-windows-x64.zip.sha256

      # Сборки под мак — если они есть. continue-on-error здесь не украшение:
      # без него отсутствующий артефакт валит шаг и с ним весь выпуск.
      - name: Collect macOS builds
        id: macos
        continue-on-error: true
        shell: bash
        run: |
          found=0
          for dmg in $(find download-artifact -name '*.dmg' 2>/dev/null); do
            cp "$dmg" deployment/
            found=1
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" = "0" ]; then
            echo "::warning::сборок под macOS в этом прогоне нет — выпуск выйдет без них"
          fi

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreenRhythm-Release-${{ github.sha }}
          path: deployment

      - name: Create GitHub Release
        if: github.event.inputs.publish == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          # ТЕГ СТАВИТСЯ НА ТОТ КОММИТ, ИЗ КОТОРОГО СОБРАН БИНАРЬ.
          #
          # Без этой строки действие создаёт тег на ВЕТКЕ ПО УМОЛЧАНИЮ, чем бы
          # ни собирали. То есть бинарь берётся с выбранной ветки, а «Source
          # code» на странице выпуска — совсем с другого дерева, и собрать из
          # него раздаваемый файл невозможно. Для GPL-3.0 это невыполненная
          # обязанность отдать соответствующий исходник там же, а для VPN-клиента
          # ещё и повод для претензии о подмене сборки.
          target_commitish: ${{ github.sha }}
          name: GreenRhythm ${{ github.event.inputs.tag }}
          generate_release_notes: true
          files: |
            deployment/*.zip
            deployment/*.sha256
            deployment/*.dmg
          draft: false
          prerelease: false

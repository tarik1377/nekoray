name: Sync signed release to website

on:
  workflow_run:
    workflows: [GreenRhythm Build]
    types: [completed]
  workflow_dispatch:
    inputs:
      verify_tag:
        description: Existing release to verify without replacing its packages
        required: true
        default: v1.9.2

permissions:
  contents: read

concurrency:
  group: sync-signed-website-release
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'workflow_dispatch'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && github.event.workflow_run.actor.login == github.repository_owner
        && github.event.workflow_run.triggering_actor.login == github.repository_owner)
      || (github.event_name == 'workflow_dispatch'
        && github.ref == 'refs/heads/main'
        && github.actor == github.repository_owner
        && github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: desktop-release
    steps:
      # Normal releases have already been signed by the build workflow.
      # A manual verification run checks the real key against existing packages
      # without changing a release or inventing a new application version.
      - name: Checkout automation for verification
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download existing verification packages
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_TAG: ${{ inputs.verify_tag }}
        run: |
          set -euo pipefail
          [[ "$VERIFY_TAG" =~ ^v[0-9]{1,3}\.[0-9]\.[0-9]{1,2}$ ]] || exit 1
          node --test tools/sign-release.test.mjs
          gh release download "$VERIFY_TAG" --repo "$GITHUB_REPOSITORY" --dir verify-packages --pattern '*-windows-x64.zip' --pattern '*-macos-*.dmg' --pattern '*.sha256'

      - name: Verify signing key with existing release
        if: github.event_name == 'workflow_dispatch'
        env:
          VERIFY_TAG: ${{ inputs.verify_tag }}
          GREENRHYTHM_RELEASE_PRIVATE_KEY: ${{ secrets.GREENRHYTHM_RELEASE_PRIVATE_KEY }}
        run: |
          node tools/sign-release.mjs --directory verify-packages --tag "$VERIFY_TAG"

      - name: Compare with website signatures
        if: github.event_name == 'workflow_dispatch'
        run: |
          node tools/verify-site-manifests.mjs --directory verify-packages

      - name: Refresh website releases
        env:
          REFRESH_SSH_KEY: ${{ secrets.SITE_RELEASE_REFRESH_SSH_KEY }}
          SITE_KNOWN_HOSTS: ${{ vars.SITE_RELEASE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          keyfile=$(mktemp)
          hostfile=$(mktemp)
          trap 'rm -f "$keyfile" "$hostfile"' EXIT
          printf '%s\n' "$REFRESH_SSH_KEY" > "$keyfile"
          printf '%s\n' "$SITE_KNOWN_HOSTS" > "$hostfile"
          test -s "$keyfile"
          test -s "$hostfile"
          ssh -i "$keyfile" -p 3333 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hostfile" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 adminuser@185.11.134.79 refresh-signed-release

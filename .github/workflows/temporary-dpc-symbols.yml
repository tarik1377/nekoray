name: Temporary public DPC symbols
on: pull_request
permissions:
  contents: read
jobs:
  public-symbols:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Public Microsoft symbols only. No user dump, account, profile or key.
      - run: curl --fail --location --retry 2 --max-time 60 --output tcpip.pdb https://msdl.microsoft.com/download/symbols/tcpip.pdb/6EAED7F235ADF1C378F44BA5FC823C691/tcpip.pdb
      - uses: actions/upload-artifact@v4
        with:
          name: public-tcpip-symbols
          path: tcpip.pdb
          retention-days: 1
